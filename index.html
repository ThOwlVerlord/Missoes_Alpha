<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missões (ALPHA)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1E9FF; --bg-2:#E2D3FF; --dot:rgba(90,50,170,.13);
  --text:#1A1033; --text-soft:#5B4A86;
  --ink:#1A1033; --shadow:#1A1033;
  --mint:#8EF0C4; --sun:#FFD84D; --coral:#FF7A8A;
  --go:#3DDC97; --pink:#FF4FA3; --sky:#4DC3FF; --grape:#6B3FD6;
  --panel:#FFFFFF; --focus:#FF4FA3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#26154F; --bg-2:#321D66; --dot:rgba(255,255,255,.07);
    --text:#FFFFFF; --text-soft:#CBB8FF; --shadow:#0C0520; --panel:#3A2375;
  }
}
:root[data-theme="dark"]{
  --bg:#26154F; --bg-2:#321D66; --dot:rgba(255,255,255,.07);
  --text:#FFFFFF; --text-soft:#CBB8FF; --shadow:#0C0520; --panel:#3A2375;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  color:var(--text);
  background-color:var(--bg);
  font-family:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:700;font-size:16px;line-height:1.45;min-height:100vh;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:-52px;z-index:-1;pointer-events:none;
  background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:26px 26px;
  animation:drift 2.4s linear infinite;
}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(26px,26px)}}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.display{font-family:"Lilita One","Arial Rounded MT Bold",Impact,sans-serif;font-weight:400;letter-spacing:.01em}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}

/* Chunky button base */
.chunk{
  border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);
  background:#fff;color:var(--ink);font-weight:900;
  transition:transform .08s,box-shadow .08s;
}
.chunk:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.chunk:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.chunk:disabled{background:#CFC6E2;color:#7C7396;box-shadow:0 3px 0 #7C7396;border-color:#7C7396}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-bottom:26px}
.logo{display:flex;align-items:center;gap:10px;flex:1 1 auto;margin:0}
.logo-spy{font-size:2.6rem;display:inline-block;animation:peek 4s ease-in-out infinite;transform-origin:bottom center}
@keyframes peek{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-12deg)}82%{transform:rotate(10deg)}88%{transform:rotate(0)}}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-title{
  font-size:clamp(1.7rem,4vw,2.4rem);color:#fff;background:var(--pink);
  border:3px solid var(--ink);border-radius:12px;padding:4px 14px 6px;
  box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg);display:inline-block;
  -webkit-text-stroke:0;text-shadow:2px 2px 0 var(--ink);
}
.alpha{font-family:"Nunito",sans-serif;font-weight:900;font-size:.8rem;background:var(--sun);color:var(--ink);border:2px solid var(--ink);
  border-radius:999px;padding:2px 9px;transform:rotate(4deg);display:inline-block;margin-left:8px;vertical-align:middle;box-shadow:2px 2px 0 var(--ink)}
.rules-btn{padding:8px 12px;display:flex;align-items:center;gap:6px;white-space:nowrap}

.hud{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.hud-box{
  background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);
  padding:6px 12px 8px;display:flex;align-items:center;gap:10px;color:var(--text);
}
.score-star{
  width:62px;height:62px;display:grid;place-items:center;background:var(--sun);color:var(--ink);
  clip-path:polygon(50% 0%,61% 33%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 33%);
  font-family:"Lilita One",Impact,sans-serif;font-size:1.45rem;padding-top:6px;
}
.hud-label{font-size:.78rem;color:var(--text-soft);font-weight:800}
.hud-val{font-family:"Lilita One",Impact,sans-serif;font-size:1.5rem;line-height:1}
.dice{display:flex;gap:2px;font-size:1.25rem;min-height:1.6rem;align-items:center;flex-wrap:wrap;max-width:150px}
.dice .more{font-family:"Lilita One",Impact,sans-serif;font-size:1.1rem;margin-left:4px}
.dice .none{font-size:.85rem;color:var(--text-soft)}
.adj{display:flex;flex-direction:column;gap:4px}
.adj button{width:28px;height:24px;border-radius:8px;padding:0;font-size:1rem;line-height:1;box-shadow:0 3px 0 var(--ink)}
.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}
.time-btns{display:flex;gap:8px}
.time-btns .chunk{padding:8px 12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.time-btns .chunk span{font-size:1.2rem}

/* Lock banner */
.lock{display:none;margin:0 0 26px;border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--shadow);
  background:repeating-linear-gradient(-45deg,var(--sun) 0 22px,#FFE88A 22px 44px);color:var(--ink);overflow:hidden}
.lock.on{display:block;animation:slam .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes slam{from{transform:scale(.8) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.lock-inner{display:flex;align-items:center;gap:18px;padding:14px 18px;flex-wrap:wrap}
.siren{font-size:2.8rem;animation:wiggle .6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.lock-clock{
  background:var(--ink);color:#fff;border-radius:16px;padding:6px 16px;
  font-family:"Lilita One",Impact,sans-serif;font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums;min-width:110px;text-align:center
}
.lock-text{flex:1 1 220px}
.lock-text strong{display:block;font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:1.6rem;line-height:1.1}
.lock .chunk{padding:8px 12px;font-size:.9rem}
.lock-bar{height:10px;background:rgba(26,16,51,.2);border-top:3px solid var(--ink)}
.lock-bar i{display:block;height:100%;background:var(--pink);transition:width .25s linear}

/* Hand */
.hand{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-bottom:34px}
.hand.jailed::after{
  content:"";position:absolute;inset:-10px;border-radius:24px;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(26,16,51,.85) 46px 56px);
  animation:bars .45s ease-out;
}
@keyframes bars{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.card{
  position:relative;border:3px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--shadow);
  color:var(--ink);display:flex;flex-direction:column;min-height:300px;
}
.card.p1{background:var(--mint)} .card.p2{background:var(--sun)} .card.p3{background:var(--coral)}
.hand .card:nth-child(1){transform:rotate(-1.4deg)}
.hand .card:nth-child(2){transform:rotate(.9deg)}
.hand .card:nth-child(3){transform:rotate(-.6deg)}
.card.dealt{animation:deal .6s cubic-bezier(.25,1.5,.5,1)}
@keyframes deal{0%{transform:rotateY(90deg) scale(.85);opacity:0}100%{opacity:1}}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 0}
.tier{font-size:.85rem;font-weight:900;background:rgba(255,255,255,.55);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.burst{
  width:74px;height:74px;display:grid;place-items:center;text-align:center;color:#fff;background:var(--ink);
  clip-path:polygon(50% 0%,62% 14%,79% 7%,82% 24%,98% 30%,90% 46%,100% 60%,85% 70%,86% 88%,68% 88%,58% 100%,45% 88%,28% 96%,23% 80%,5% 76%,12% 60%,0% 46%,13% 34%,10% 16%,28% 16%,38% 3%);
  font-family:"Lilita One",Impact,sans-serif;font-size:1.55rem;line-height:.9;margin:-26px -26px 0 0;transform:rotate(10deg);
}
.burst small{display:block;font-size:.7rem;font-family:"Nunito",sans-serif;font-weight:900}
.card-body{display:flex;gap:14px;padding:12px 16px 16px;flex:1;align-items:flex-start}
.card-emoji{
  flex:0 0 auto;width:68px;height:68px;border-radius:50%;background:#fff;border:3px solid var(--ink);
  display:grid;place-items:center;font-size:2.2rem;line-height:1;box-shadow:3px 3px 0 var(--ink);
}
.card-text{margin:0;font-size:1.06rem;font-weight:800;line-height:1.4}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 16px}
.act{padding:10px 6px;font-size:.98rem;display:flex;align-items:center;justify-content:center;gap:6px}
.act.done{background:var(--go)}
.act.caught{background:#fff}
.act.reroll{grid-column:1 / -1;background:var(--sky)}
.act.reroll small{font-weight:800;opacity:.8}

/* Accuse */
.h2{font-size:1.7rem;margin:0 0 12px;line-height:1.1}
.accuse{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:36px}
.big{padding:16px 14px;font-size:1.15rem;display:flex;align-items:center;gap:14px;text-align:left;border-radius:18px;box-shadow:0 6px 0 var(--ink)}
.big .em{font-size:2.3rem;line-height:1}
.big small{display:block;font-weight:800;font-size:.88rem;opacity:.8}
.big.yes{background:var(--go)} .big.no{background:var(--coral)}

/* Lower */
.lower{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
.panel{background:var(--panel);color:var(--text);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);padding:16px 18px}
.panel .h2{font-size:1.35rem}
.history{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.history li button{
  width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 10px;
  display:flex;gap:10px;align-items:baseline;font-weight:700
}
.history li button:hover{background:rgba(127,90,220,.14)}
.history .t{font-size:.78rem;color:var(--text-soft);font-variant-numeric:tabular-nums;flex:0 0 auto}
.history li.current button{background:var(--sun);color:var(--ink);font-weight:900}
.history li.current .t{color:var(--ink)}
.history li.future button{opacity:.45;text-decoration:line-through}
.hint{font-size:.85rem;color:var(--text-soft);margin:10px 0 0;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.stats div{border:2px solid var(--ink);border-radius:14px;padding:8px 10px;color:var(--ink)}
.stats div:nth-child(1){background:var(--mint)} .stats div:nth-child(2){background:var(--coral)}
.stats div:nth-child(3){background:var(--sky)} .stats div:nth-child(4){background:var(--sun)}
.stats dt{font-size:.8rem;font-weight:800}
.stats dd{margin:0;font-family:"Lilita One",Impact,sans-serif;font-size:1.6rem;line-height:1.1}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .chunk{padding:9px 14px}

/* Start */
.start{display:flex;flex-direction:column;align-items:center}
.start-hero{min-height:calc(48vh - 60px);display:grid;place-items:center;width:100%}
.start-rules{width:100%;max-width:980px;margin-bottom:30px}
.start-rules .h2{text-align:center;margin-bottom:18px}
.go{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:1.7rem;padding:14px 34px;background:var(--pink);color:#fff;
  border-radius:20px;box-shadow:0 7px 0 var(--ink);text-shadow:2px 2px 0 var(--ink);animation:breathe 2.4s ease-in-out infinite}
.go:not(:disabled):hover{animation:none}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.go small{display:block;font-family:"Nunito",sans-serif;font-weight:800;font-size:.85rem;text-shadow:none}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);padding:12px;color:var(--ink);font-size:.95rem}
.rule b{display:block;font-size:1.8rem;line-height:1.2}
.rule:nth-child(1){background:var(--mint);transform:rotate(-2deg)}
.rule:nth-child(2){background:var(--coral);transform:rotate(1.5deg)}
.rule:nth-child(3){background:var(--sky);transform:rotate(1deg)}
.rule:nth-child(4){background:var(--sun);transform:rotate(-1.5deg)}
.rule:nth-child(5){background:#C9B6FF;transform:rotate(1.2deg)}
.rule:nth-child(6){background:#FFB86B;transform:rotate(-1deg)}
.rule em{font-style:normal;background:rgba(255,255,255,.6);border-radius:6px;padding:0 4px;font-weight:900}

/* Rules dialog */
dialog.modal{border:3px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--shadow);background:var(--panel);color:var(--text);
  width:min(720px,calc(100% - 24px));max-height:calc(100% - 40px);padding:20px 22px 24px}
dialog.modal::backdrop{background:rgba(20,10,50,.6)}
dialog.modal[open]{animation:slam .35s cubic-bezier(.3,1.6,.5,1)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.modal-head .h2{margin:0}
.modal .rules{grid-template-columns:1fr 1fr}
.modal-close{padding:6px 12px}

/* Pending confirmation */
.card.pending{animation:throb 1s ease-in-out infinite}
@keyframes throb{0%,100%{box-shadow:7px 7px 0 var(--shadow)}50%{box-shadow:7px 7px 0 var(--shadow),0 0 0 7px rgba(255,255,255,.55)}}
.hand .card.pending:nth-child(n){transform:none}
.pend{display:flex;align-items:center;gap:12px;margin:0 14px 12px;background:rgba(255,255,255,.65);border:3px dashed var(--ink);border-radius:16px;padding:10px 12px}
.pend-clock{flex:0 0 auto;width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:var(--ink);color:#fff;
  display:grid;place-items:center;font-family:"Lilita One",Impact,sans-serif;font-size:1.8rem;font-variant-numeric:tabular-nums;
  background-image:conic-gradient(var(--pink) var(--p,100%),transparent 0)}
.pend-clock span{background:var(--ink);border-radius:50%;width:42px;height:42px;display:grid;place-items:center}
.pend-txt{font-size:.92rem;line-height:1.3}
.pend-txt b{display:block;font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:1.15rem}
.act.cancel{background:#fff}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px) scale(.9);
  background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);
  padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;
  transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;max-width:calc(100% - 24px);z-index:20;font-weight:800
}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast button{background:var(--sun);border:2px solid var(--ink);border-radius:10px;padding:5px 10px;font-weight:900;color:var(--ink)}

/* FX */
.fx{position:fixed;pointer-events:none;z-index:30;left:0;top:0}
.float-pts{font-family:"Lilita One",Impact,sans-serif;font-size:3rem;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:25;background:var(--coral);opacity:0}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

@media (max-width:900px){
  .hand{grid-template-columns:1fr}
  .card{min-height:0}
  .lower{grid-template-columns:1fr}
  .rules{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .accuse,.rules,.modal .rules{grid-template-columns:1fr}
  .hud{width:100%}
  .hud-box{flex:1}
  .time-btns{width:100%}
  .time-btns .chunk{flex:1;justify-content:center}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button">Desfazer</button></div>
<div class="flash" id="flash"></div>
<dialog class="modal" id="rulesDlg" aria-labelledby="rulesTitle">
  <div class="modal-head"><h2 class="h2 display" id="rulesTitle">📜 Regras</h2><button class="chunk modal-close" type="button" id="rulesClose">Fechar</button></div>
  <div id="rulesBody"></div>
</dialog>

<script>
/* ---------- Missões ---------- */
const MISSIONS = [
[1,1,"🍍","Use a palavra \"abacaxi\" pelo menos 3 vezes em 1 minuto."],

[4,1,"👴","Use a expressão \"na minha época\" em alguma frase."],
[5,1,"🎵","Cantarole uma música por pelo menos 10 segundos."],
[6,1,"🎞️","Mande um GIF ou sticker no chat sem contexto."],
[7,1,"🥤","Diga que vai pegar água, espere 5 segundos e diga que voltou."],

[9,1,"🦒","Mencione um animal aleatório numa conversa que não tem nada a ver com animais."],
[10,1,"🌍","Use pelo menos 2 palavras em outro idioma no meio de uma frase. Não valem palavras que façam parte de um nome (de jogo, filme, marca etc.)."],

[12,1,"😂","Ria de algo que claramente não foi engraçado."],
[13,1,"📛","Diga o nome de um mesmo jogador 5 vezes em 2 minutos."],
[14,1,"📖","Use a palavra \"literalmente\" 3 vezes em 2 minutos."],
[15,1,"⚫","Mande uma mensagem no chat contendo apenas um ponto final (\".\")."],
[16,1,"🐮","Faça um barulho de animal, mesmo que rapidinho."],
[17,1,"😔","Comece uma frase, pare no meio e diga \"esquece\"."],
[18,1,"🧐","Diga \"hmm\" pensativo depois que alguém falar, 3 vezes em 3 minutos."],
[19,1,"🤧","Diga \"saúde\" sem ninguém ter espirrado."],
[20,1,"🤫","Fale uma frase inteira sussurrando."],
[21,1,"❓","Faça uma pergunta de sim ou não para o grupo todo. Todos precisam responder."],
[22,1,"✍️","Fale uma frase que rime."],
[23,1,"🎩","Diga \"com todo respeito\" antes de discordar de algo obviamente correto. Depois da conclusão, pelo menos metade dos jogadores precisa concordar que era algo obviamente correto."],
[24,1,"🥱","Boceje alto."],
[25,1,"🔁","Responda com outra pergunta tudo o que te disserem, 3 vezes seguidas."],
[26,1,"🍽️","Fale sobre o que você comeu hoje sem ninguém perguntar."],
[27,1,"✂️","Fique 1 minuto respondendo tudo com no máximo 3 palavras."],
[28,1,"📅","Faça alguém dizer a palavra \"segunda-feira\"."],
[29,1,"👓","Fale uma frase inteira em terceira pessoa, referindo-se a si mesmo pelo próprio nome."],
[30,1,"🚀","Faça uma contagem regressiva em voz alta (\"5, 4, 3, 2, 1… pronto\") antes de fazer qualquer coisa."],
[31,1,"📜","Use 2 ditados populares diferentes em um intervalo de 3 minutos."],
[32,1,"💡","Diga \"fato curioso:\" e conte um fato verdadeiro sobre qualquer assunto. Repita 2 vezes."],
[33,2,"🔢","Mencione todos números de 10 a 20 em 2 minutos."],
[34,1,"😮‍💨","Dê um suspiro longo e audível 2 vezes em 2 minutos."],
[35,1,"🎓","Use uma palavra em latim em uma frase. Repita 2 vezes."],
[36,1,"🎙️","Narre algo que você está fazendo por pelo menos 15 segundos."],

const CONFIRM_MS = 10000;
const START_TOKENS = 2;

const TIER = {1:"Moleza",2:"Ousada",3:"Cara de pau"};

/* ---------- Estado + histórico ---------- */
function blankState(){
  return {started:false,score:0,tokens:0,hand:[],deck:[],nextUid:1,lockUntil:0,lockKind:"",
          stats:{done:0,caught:0,catches:0,misses:0}};
}
let history = {entries:[{label:"Antes do jogo",time:Date.now(),state:blankState()}],index:0};
let pending = {}; // uid -> timestamp em que a missão é confirmada

const clone = o => JSON.parse(JSON.stringify(o));
const cur = () => history.entries[history.index].state;
const isLocked = s => s.lockUntil > Date.now();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawInto(s){
  const held = new Set(s.hand.map(h=>h.id));
  let idx = s.deck.findIndex(id=>!held.has(id));
  if(idx === -1){ s.deck = shuffle(MISSIONS.map(m=>m.id).filter(id=>!held.has(id))); idx = 0; }
  const [id] = s.deck.splice(idx,1);
  return {uid:s.nextUid++, id};
}
function replaceSlot(s,slot){ s.hand.splice(slot,1); s.hand.splice(slot,0,drawInto(s)); }
const slotOf = (s,uid) => s.hand.findIndex(h=>h.uid===uid);

function prunePending(){
  const uids = new Set(cur().hand.map(h=>h.uid));
  Object.keys(pending).forEach(u=>{ if(!uids.has(+u)) delete pending[u]; });
}
function commit(label, mutate, toastMsg, fx){
  const s = clone(cur());
  if(mutate(s) === false) return false;
  history.entries = history.entries.slice(0,history.index+1);
  history.entries.push({label,time:Date.now(),state:s});
  if(history.entries.length > 400) history.entries.shift();
  history.index = history.entries.length-1;
  prunePending(); save(); render();
  if(toastMsg) toast(toastMsg);
  if(fx) fx();
  return true;
}
function moveTo(i,msg){ history.index=i; prunePending(); save(); render(); if(msg) toast(msg,false); }
function undo(){ if(history.index>0) moveTo(history.index-1,"↶ Desfeito: "+history.entries[history.index].label) }
function redo(){ if(history.index<history.entries.length-1) moveTo(history.index+1,"↷ Refeito: "+history.entries[history.index+1].label) }
function jumpTo(i){ if(i!==history.index) moveTo(i) }

/* ---------- Ações ---------- */
let lastBtn = null;
const A = {
  start(){
    pending = {};
    commit("Jogo começou", s=>{
      Object.assign(s, blankState());
      s.started = true; s.tokens = START_TOKENS;
      s.deck = shuffle(MISSIONS.map(m=>m.id));
      for(let i=0;i<HAND_SIZE;i++) s.hand.push(drawInto(s));
    }, "🕵️ Missões entregues. Boa sorte, agente!");
  },
  complete(slot){
    const s = cur(); if(isLocked(s)) return;
    const h = s.hand[slot];
    pending[h.uid] = Date.now()+CONFIRM_MS;
    save(); render();
    toast("⏳ Segura a onda: se ninguém te pegar em 10s, os pontos são seus.",false);
  },
  confirm(uid){
    delete pending[uid]; save();
    const s = cur(); const slot = slotOf(s,uid);
    if(slot<0){ render(); return; }
    const m = BY_ID[s.hand[slot].id];
    const origin = centerOf(document.querySelector(`[data-uid="${uid}"]`));
    commit(`Concluiu ${m.emoji} (+${m.pts})`, st=>{
      st.score += m.pts; st.tokens += 1; st.stats.done++;
      replaceSlot(st,slot);
    }, pick([`Mandou bem, agente! +${m.pts} ⭐ e +1 🎲`,`Ninguém viu nada 😎 +${m.pts} ⭐ e +1 🎲`,`Missão cumprida na surdina! +${m.pts} ⭐ e +1 🎲`]),
    ()=>{confetti(origin);floatText(origin,"+"+m.pts)});
  },
  cancelPending(slot){
    const uid = cur().hand[slot].uid;
    delete pending[uid]; save(); render();
    toast("↩ Conclusão cancelada. A missão continua na mão.",false);
  },
  caught(slot){
    const s = cur(); const h = s.hand[slot];
    const wasPending = !!pending[h.uid];
    if(isLocked(s) && !wasPending) return;
    delete pending[h.uid];
    const m = BY_ID[h.id];
    commit(`Foi descoberto em ${m.emoji}`, st=>{
      st.stats.caught++;
      replaceSlot(st,slot);
      st.lockUntil = Date.now()+LOCK_MS; st.lockKind="caught";
    }, pick(["🚨 Pego no flagra! 60s de castigo","🙈 Xiii, te pegaram! 60s de castigo"]), alarm);
  },
  reroll(slot){
    const m = BY_ID[cur().hand[slot].id];
    commit(`Trocou ${m.emoji} (−1 🎲)`, s=>{
      if(isLocked(s) || s.tokens<1) return false;
      s.tokens -= 1; replaceSlot(s,slot);
    }, pick(["🎲 Nova missão na mesa!","🎲 Essa não servia mesmo."]));
  },
  catchOther(){
    const origin = centerOf(lastBtn);
    commit("Descobriu alguém (+1)", s=>{
      if(isLocked(s)) return false;
      s.score += 1; s.stats.catches++;
    }, pick(["🦅 Olho de águia! +1 ⭐","🔍 Detetive nato! +1 ⭐","😏 Achou que ia passar batido? +1 ⭐"]),
    ()=>{confetti(origin,["🔍","⭐","👀"]);floatText(origin,"+1")});
  },
  miss(){
    commit("Errou uma acusação", s=>{
      if(isLocked(s)) return false;
      s.stats.misses++;
      s.lockUntil = Date.now()+LOCK_MS; s.lockKind="miss";
    }, pick(["🤦 Acusou errado… 60s no cantinho","🪑 Sem provas, sem pontos. 60s de castigo"]), alarm);
  },
  adjust(field,delta){
    commit(`Ajuste manual: ${delta>0?"+":"−"}1 ${field==="score"?"⭐":"🎲"}`, s=>{
      if(s[field]+delta<0) return false;
      s[field]+=delta;
    });
  },
  endLock(){ commit("Encerrou o castigo antes", s=>{ if(!isLocked(s)) return false; s.lockUntil=0; }); },
  newGame(){
    if(!confirm("Começar um novo jogo? Pontos e missões voltam do zero (dá para desfazer).")) return;
    A.start();
  },
  rules(){ openRules(); }
};

/* ---------- Persistência ---------- */
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({history,pending})) }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && d.history && Array.isArray(d.history.entries) && d.history.entries.length){
      history = d.history;
      if(history.index<0||history.index>=history.entries.length) history.index=history.entries.length-1;
    }
    if(d && d.pending && typeof d.pending==="object") pending = d.pending;
    prunePending();
  }catch(e){}
}

/* ---------- Efeitos visuais ---------- */
function centerOf(el){
  if(!el||!el.isConnected) return {x:innerWidth/2,y:innerHeight/2};
  const r=el.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2};
}
function confetti(o,emojis){
  if(reduceMotion) return;
  const colors=["#FF4FA3","#FFD84D","#3DDC97","#4DC3FF","#FF7A8A","#6B3FD6"];
  for(let i=0;i<28;i++){
    const p=document.createElement("div"); p.className="fx";
    if(emojis && i%3===0){p.textContent=pick(emojis);p.style.fontSize="22px"}
    else{p.style.width="10px";p.style.height=(8+Math.random()*8)+"px";p.style.background=pick(colors);p.style.border="2px solid #1A1033";p.style.borderRadius=Math.random()<.4?"50%":"2px"}
    document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2, dist=80+Math.random()*160;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-120;
    p.animate([
      {transform:`translate(${o.x}px,${o.y}px) rotate(0)`,opacity:1},
      {transform:`translate(${o.x+dx}px,${o.y+dy}px) rotate(${Math.random()*720-360}deg)`,opacity:1,offset:.6},
      {transform:`translate(${o.x+dx*1.1}px,${o.y+dy+220}px) rotate(${Math.random()*720}deg)`,opacity:0}
    ],{duration:1200+Math.random()*500,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>p.remove();
  }
}
function floatText(o,txt){
  if(reduceMotion) return;
  const p=document.createElement("div"); p.className="fx float-pts"; p.textContent=txt;
  document.body.appendChild(p);
  p.animate([
    {transform:`translate(${o.x-24}px,${o.y-30}px) scale(.4)`,opacity:0},
    {transform:`translate(${o.x-24}px,${o.y-80}px) scale(1.2)`,opacity:1,offset:.3},
    {transform:`translate(${o.x-24}px,${o.y-150}px) scale(1)`,opacity:0}
  ],{duration:1100,easing:"ease-out"}).onfinish=()=>p.remove();
}
function alarm(){
  if(reduceMotion) return;
  document.getElementById("flash").animate([{opacity:0},{opacity:.45},{opacity:0},{opacity:.3},{opacity:0}],{duration:700});
  const hand=document.querySelector(".hand");
  if(hand){hand.classList.remove("shake");void hand.offsetWidth;hand.classList.add("shake")}
}

  </section>` : "";

  const cards = s.hand.map((h,i)=>{
    const m = BY_ID[h.id];
    const isNew = !renderedUids.has(h.uid);
    const pend = pending[h.uid];
    const left = pend ? Math.max(0,pend-Date.now()) : 0;
    const actions = pend ? `

      <div class="card-actions">
        <button class="chunk act caught" type="button" data-act="caught" data-slot="${i}">🙈 Me pegaram</button>
        <button class="chunk act cancel" type="button" data-act="cancelPending" data-slot="${i}">↩ Cancelar</button>
      </div>` : `
      <div class="card-actions">
        <button class="chunk act done" type="button" data-act="complete" data-slot="${i}" ${locked?"disabled":""}>✅ Consegui!</button>
        <button class="chunk act caught" type="button" data-act="caught" data-slot="${i}" ${locked?"disabled":""}>🙈 Me pegaram</button>
        <button class="chunk act reroll" type="button" data-act="reroll" data-slot="${i}" ${(locked||s.tokens<1)?"disabled":""}>🎲 Trocar missão <small>(−1 token)</small></button>
      </div>`;
    return `
    <article class="card p${m.pts} ${isNew?"dealt":""} ${pend?"pending":""}" data-uid="${h.uid}" aria-label="Missão ${TIER[m.pts]}, ${m.pts} ${m.pts>1?"pontos":"ponto"}">
      <div class="card-head">
        <span class="tier">${TIER[m.pts]}</span>
        <div class="burst" aria-hidden="true"><div>+${m.pts}<small>${m.pts>1?"pontos":"ponto"}</small></div></div>
      </div>
      <div class="card-body">
        <div class="card-emoji" aria-hidden="true">${m.emoji}</div>
        <p class="card-text">${esc(m.text)}</p>
      </div>
      ${actions}
    </article>`;
  }).join("");
  renderedUids = new Set(s.hand.map(h=>h.uid));

  const accuse = `
  <h2 class="h2 display">Pegou alguém no flagra?</h2>
  <section class="accuse">
    <button class="chunk big yes" type="button" data-do="catchOther" ${locked?"disabled":""}><span class="em">🔍</span><span>Acertei a acusação!<small>+1 ponto pra você</small></span></button>
    <button class="chunk big no" type="button" data-do="miss" ${locked?"disabled":""}><span class="em">🤦</span><span>Errei a acusação<small>60s de castigo</small></span></button>
  </section>`;

  app.innerHTML = top + lockHtml + `<section class="hand ${locked?"jailed":""}">${cards}</section>` + accuse + historyHtml();
  bindAll();
}

function historyHtml(){
  const s = cur();
  const items = history.entries.map((e,i)=>({e,i})).reverse().map(({e,i})=>{
    const cls = i===history.index?"current":(i>history.index?"future":"");
    return `<li class="${cls}"><button type="button" data-jump="${i}"><span class="t">${fmtTime(e.time)}</span><span>${esc(e.label)}</span></button></li>`;
  }).join("");
  return `
  <div class="lower">
    <section class="panel">
      <h2 class="h2 display">Linha do tempo</h2>
      <ul class="history">${items}</ul>
      <p class="hint">Clicou errado? Toque em qualquer momento da lista para voltar até ele. Ctrl+Z desfaz, Ctrl+Shift+Z refaz.</p>
    </section>
    <section class="panel">
      <h2 class="h2 display">Seu dossiê</h2>
      <dl class="stats">
        <div><dt>😎 Missões cumpridas</dt><dd>${s.stats.done}</dd></div>
        <div><dt>🙈 Vezes pego</dt><dd>${s.stats.caught}</dd></div>
        <div><dt>🔍 Espiões pegos</dt><dd>${s.stats.catches}</dd></div>
        <div><dt>🤦 Acusações furadas</dt><dd>${s.stats.misses}</dd></div>
      </dl>
      <div class="row"><button class="chunk" type="button" data-do="newGame">🔄 Novo jogo</button></div>
    </section>
  </div>`;
}

function bindAll(){
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{lastBtn=b;A[b.dataset.act](+b.dataset.slot)});
  app.querySelectorAll("[data-do]").forEach(b=>b.onclick=()=>{
    lastBtn=b; const d=b.dataset.do;
    if(d==="undo") undo(); else if(d==="redo") redo(); else A[d]();
  });
  app.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{const [f,v]=b.dataset.adj.split(":");A.adjust(f,+v)});
  app.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>jumpTo(+b.dataset.jump));
}

/* ---------- Toast ---------- */
const toastEl=document.getElementById("toast"), toastMsg=document.getElementById("toastMsg"), toastUndo=document.getElementById("toastUndo");
let toastTimer=null;
function toast(msg,withUndo=true){
  toastMsg.textContent=msg; toastUndo.style.display=withUndo?"":"none";
  toastEl.classList.add("show"); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove("show"),4000);
}
toastUndo.onclick=()=>{toastEl.classList.remove("show");undo()};

/* ---------- Relógio ---------- */
setInterval(()=>{
  const s=cur(); const now=Date.now();
  // confirmações de 10s
  for(const u of Object.keys(pending)){
    const left = pending[u]-now;
    if(left<=0){ A.confirm(+u); return; }
    const el=document.getElementById("pc-"+u);
    if(el){ el.style.setProperty("--p",(left/CONFIRM_MS*100).toFixed(1)+"%"); el.firstElementChild.textContent=Math.ceil(left/1000); }
  }
  // castigo
  const locked=isLocked(s);
  if(lastLocked && !locked){
    render(); toast("🔓 Castigo acabou! Pode voltar a aprontar.",false);
    confetti({x:innerWidth/2,y:120}); return;
  }
  if(locked){
    const rem=s.lockUntil-now;
    const t=document.getElementById("lockTime"), bar=document.getElementById("lockBar");
    if(t) t.textContent=Math.ceil(rem/1000)+"s";
    if(bar) bar.style.width=(rem/LOCK_MS*100).toFixed(1)+"%";
  }
},200);

/* ---------- Atalhos ---------- */
document.addEventListener("keydown",e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if(k==="z" && !e.shiftKey){e.preventDefault();undo()}
  else if((k==="z"&&e.shiftKey)||k==="y"){e.preventDefault();redo()}
});

load();
render();

</script>
</body>
</html>
